<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Studio Junior Tattoo — Blackwork e realismo em Aracaju/SE</title>
    <meta
      name="description"
      content="Estúdio de tatuagem em Aracaju/SE. Blackwork, fineline, realismo e old school. Atendimento só com hora marcada — planeje sua ideia ou agende sua sessão online."
    />
    <meta name="author" content="Studio Junior Tattoo" />

    <meta name="theme-color" content="#0b0b0d" />
    <meta name="color-scheme" content="dark" />

    <!-- PWA / iOS -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Studio Junior" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Social -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Studio Junior Tattoo" />
    <meta property="og:title" content="Studio Junior Tattoo — Aracaju/SE" />
    <meta
      property="og:description"
      content="Tatuagem autoral em Aracaju. Escolha seu artista, planeje a ideia e marque sua sessão."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- Painted before React mounts so the first frame is never a white flash -->
    <style>
      html {
        background: #0b0b0d;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b0b0d;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      #boot span {
        font: 400 13px/1 ui-sans-serif, system-ui, sans-serif;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #6d6862;
        animation: bootpulse 1.6s ease-in-out infinite;
      }
      @keyframes bootpulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><span>Studio Junior</span></div>
    <noscript>
      <p style="color: #ece7dd; font-family: sans-serif; padding: 2rem">
        Este site precisa de JavaScript ativado. Fale com o estúdio pelo WhatsApp (79) 99999-0001.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
